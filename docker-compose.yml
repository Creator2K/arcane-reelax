services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:17-alpine
    container_name: reelax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reelax
      POSTGRES_PASSWORD: reelax_dev
      POSTGRES_DB: reelax
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelax -d reelax"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
