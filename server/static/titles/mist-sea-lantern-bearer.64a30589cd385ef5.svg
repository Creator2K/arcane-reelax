<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 64" role="img" aria-labelledby="title description">
  <title id="title">雾海提灯者</title>
  <desc id="description">青蓝雾潮与摇曳提灯构成的动态称号</desc>
  <defs>
    <linearGradient id="mist-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071D25"/>
      <stop offset=".5" stop-color="#123D48"/>
      <stop offset="1" stop-color="#081923"/>
    </linearGradient>
    <linearGradient id="mist-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3AA7AC"/>
      <stop offset=".45" stop-color="#B7F2E9"/>
      <stop offset=".72" stop-color="#75C8D3"/>
      <stop offset="1" stop-color="#2A6E7C"/>
    </linearGradient>
    <linearGradient id="mist-letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2FFF9"/>
      <stop offset=".48" stop-color="#A9E9DF"/>
      <stop offset="1" stop-color="#5FC0C6"/>
    </linearGradient>
    <radialGradient id="lantern-light">
      <stop offset="0" stop-color="#FFF5B0"/>
      <stop offset=".35" stop-color="#F2D66C" stop-opacity=".8"/>
      <stop offset="1" stop-color="#EACF6A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A8E3E0" stop-opacity="0"/>
      <stop offset=".45" stop-color="#C9F3EE" stop-opacity=".45"/>
      <stop offset="1" stop-color="#A8E3E0" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mist-clip">
      <path d="M20 4h238l16 16v24l-16 16H20L4 44V20z"/>
    </clipPath>
    <filter id="mist-glow" x="-70%" y="-80%" width="240%" height="260%">
      <feGaussianBlur stdDeviation="2.3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mist-bank-a { animation: mist-drift-a 7.5s ease-in-out infinite; }
    .mist-bank-b { animation: mist-drift-b 9s ease-in-out infinite; }
    .mist-lantern { animation: mist-lantern-sway 4s ease-in-out infinite; transform-origin: 48px 13px; }
    .mist-light { animation: mist-light-pulse 3.2s ease-in-out infinite; transform-origin: 48px 34px; }
    @keyframes mist-drift-a { 0%, 100% { transform: translateX(-8px); opacity: .28; } 50% { transform: translateX(10px); opacity: .55; } }
    @keyframes mist-drift-b { 0%, 100% { transform: translateX(9px); opacity: .2; } 50% { transform: translateX(-7px); opacity: .42; } }
    @keyframes mist-lantern-sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
    @keyframes mist-light-pulse { 0%, 100% { opacity: .55; transform: scale(.92); } 50% { opacity: .9; transform: scale(1.08); } }
    @media (prefers-reduced-motion: reduce) { .mist-bank-a, .mist-bank-b, .mist-lantern, .mist-light { animation: none; } }
  </style>

  <path d="M20 4h238l16 16v24l-16 16H20L4 44V20z" fill="url(#mist-panel)" stroke="url(#mist-rim)" stroke-width="2"/>
  <path d="M22 9h231l11 11M14 44l11 11h228" fill="none" stroke="#B8EBE6" stroke-width=".8" opacity=".5"/>
  <g clip-path="url(#mist-clip)">
    <path class="mist-bank-a" d="M-20 35c35-12 65-4 91 1s63 7 102-3 75-6 126 1v15H-20z" fill="url(#mist-fade)"/>
    <path class="mist-bank-b" d="M-18 47c37-8 61-1 94 4s62-8 101-5 74 8 121-2v16H-18z" fill="#8BD0D0" opacity=".25"/>
    <path d="M4 51c38-6 68 7 103 0s75-5 167-11" fill="none" stroke="#4EA6AF" stroke-width="1.4" opacity=".55"/>
  </g>
  <circle class="mist-light" cx="48" cy="34" r="23" fill="url(#lantern-light)"/>
  <g class="mist-lantern">
    <path d="M48 8v8M40 19c1-9 15-9 16 0" fill="none" stroke="#EEDB8A" stroke-width="2" stroke-linecap="round"/>
    <path d="M36 22h24l-4 28H40z" fill="#0B2830" stroke="#DFCA75" stroke-width="2"/>
    <path d="M40 27h16l-2 17H42z" fill="#FFE687" opacity=".9" filter="url(#mist-glow)"/>
    <path d="M39 22l18 28M57 22 39 50" stroke="#A68237" stroke-width="1" opacity=".9"/>
    <path d="M36 22h24M39 50h18" stroke="#FFF0AD" stroke-width="2"/>
  </g>
  <text x="177" y="42" fill="url(#mist-letter)" stroke="#06171E" stroke-width="2.4" paint-order="stroke" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="25" font-weight="900" letter-spacing="2.5" text-anchor="middle">雾海提灯者</text>
  <path d="M94 49h147" stroke="url(#mist-rim)" stroke-width="1" opacity=".65"/>
  <circle cx="247" cy="49" r="2" fill="#C5F4EA"/>
</svg>
