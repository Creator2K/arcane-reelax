    <script>
      (() => {
        let storedTheme = null;
        try {
          storedTheme = localStorage.getItem('arcane-reelax-theme');
        } catch {
          // Use the system preference when storage is unavailable.
        }
        const theme = storedTheme === 'light' || storedTheme === 'dark'
          ? storedTheme
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        requestAnimationFrame(() => {
          const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--canvas').trim();
          if (themeColor) document.querySelector('meta[name="theme-color"]')?.setAttribute('content', themeColor);
        });
      })();
    </script>
