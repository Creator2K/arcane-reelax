<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 282 64" role="img" aria-labelledby="title description">
  <title id="title">长夜领航者</title>
  <desc id="description">旋转星盘与划过长夜的星芒构成的动态称号</desc>
  <defs>
    <linearGradient id="night-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B25"/>
      <stop offset=".48" stop-color="#17184D"/>
      <stop offset="1" stop-color="#071833"/>
    </linearGradient>
    <linearGradient id="night-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5265C6"/>
      <stop offset=".34" stop-color="#89E0EC"/>
      <stop offset=".66" stop-color="#D9B5FF"/>
      <stop offset="1" stop-color="#5265C6"/>
    </linearGradient>
    <linearGradient id="night-letter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset=".32" stop-color="#A9E9FF"/>
      <stop offset=".68" stop-color="#D8BDFF"/>
      <stop offset="1" stop-color="#8AA5FF"/>
    </linearGradient>
    <radialGradient id="night-core">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".25" stop-color="#BDF4FF"/>
      <stop offset="1" stop-color="#758EFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="night-clip">
      <path d="M18 4h246l14 14v28l-14 14H18L4 46V18z"/>
    </clipPath>
    <filter id="night-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .night-ring { animation: night-rotate 8s linear infinite; transform-origin: 48px 32px; }
    .night-star-a { animation: night-twinkle 2.6s ease-in-out infinite; }
    .night-star-b { animation: night-twinkle 3.2s ease-in-out -1.2s infinite; }
    .night-meteor { animation: night-meteor 5.8s ease-in-out infinite; }
    @keyframes night-rotate { to { transform: rotate(360deg); } }
    @keyframes night-twinkle { 0%, 100% { opacity: .28; transform: scale(.75); } 50% { opacity: 1; transform: scale(1.16); } }
    @keyframes night-meteor { 0%, 56% { opacity: 0; transform: translate(-30px, 12px); } 62% { opacity: .9; } 78%, 100% { opacity: 0; transform: translate(38px, -14px); } }
    @media (prefers-reduced-motion: reduce) { .night-ring, .night-star-a, .night-star-b, .night-meteor { animation: none; } }
  </style>

  <path d="M18 4h246l14 14v28l-14 14H18L4 46V18z" fill="url(#night-panel)" stroke="url(#night-rim)" stroke-width="2"/>
  <g clip-path="url(#night-clip)">
    <path d="M4 49c44-15 77 9 119-1s86-6 155-20v32H4z" fill="#245A83" opacity=".2"/>
    <path d="M3 52c46-10 76 8 117 0s84-7 158-20" fill="none" stroke="#77D0E4" stroke-width="1.2" opacity=".48"/>
    <g fill="#DDF8FF">
      <circle class="night-star-a" cx="96" cy="16" r="1.5"/><circle class="night-star-b" cx="130" cy="11" r="1.1"/>
      <circle class="night-star-b" cx="235" cy="16" r="1.4"/><circle class="night-star-a" cx="258" cy="30" r="1"/>
    </g>
    <path class="night-meteor" d="M196 28 232 9" stroke="#D9F8FF" stroke-width="2" stroke-linecap="round" filter="url(#night-glow)"/>
  </g>
  <g class="night-ring" fill="none" stroke="url(#night-rim)">
    <circle cx="48" cy="32" r="22" stroke-width="1.6" stroke-dasharray="5 3"/>
    <circle cx="48" cy="32" r="16" stroke-width=".8" opacity=".65"/>
    <path d="M48 7v7M48 50v7M23 32h7M66 32h7M30 14l5 5M61 45l5 5M66 14l-5 5M35 45l-5 5"/>
  </g>
  <g filter="url(#night-glow)">
    <path d="M48 14 53 28 67 32 53 37 48 51 43 37 29 32 43 28z" fill="url(#night-letter)" opacity=".95"/>
    <circle cx="48" cy="32" r="4" fill="#FFFFFF"/>
  </g>
  <text x="181" y="42" fill="url(#night-letter)" stroke="#05091F" stroke-width="2.5" paint-order="stroke" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="25" font-weight="900" letter-spacing="2.4" text-anchor="middle">长夜领航者</text>
  <path d="M94 49h154" stroke="url(#night-rim)" opacity=".68"/>
  <path d="m254 49 3-3 3 3-3 3z" fill="#D8C4FF" filter="url(#night-glow)"/>
</svg>
