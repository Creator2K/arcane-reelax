<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 72" role="img" aria-labelledby="title description">
  <title id="title">世界线维护者</title>
  <desc id="description">多条发光时间线汇聚于稳定核心的动态世界线维护者称号</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05051A"/>
      <stop offset="0.5" stop-color="#17123B"/>
      <stop offset="1" stop-color="#030817"/>
    </linearGradient>
    <linearGradient id="timeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30F3FF"/>
      <stop offset="0.48" stop-color="#A36CFF"/>
      <stop offset="1" stop-color="#FF4FD8"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6FAFF"/>
      <stop offset="0.5" stop-color="#C7B3FF"/>
      <stop offset="1" stop-color="#FFB7EE"/>
    </linearGradient>
    <filter id="line-glow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feFlood flood-color="#7A72FF" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="core">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#64F6FF"/>
      <stop offset="1" stop-color="#7950E8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><path d="M18 5h364l13 13v36l-13 13H18L5 54V18z"/></clipPath>
  </defs>

  <path d="M18 5h364l13 13v36l-13 13H18L5 54V18z" fill="url(#panel)" stroke="#7257BC" stroke-width="1.5"/>
  <g clip-path="url(#frame)" opacity="0.25" stroke="#7C6FD2" stroke-width="0.6">
    <path d="M0 18h400M0 36h400M0 54h400"/>
    <path d="M25 0v72M55 0v72M85 0v72M115 0v72M145 0v72M175 0v72M205 0v72M235 0v72M265 0v72M295 0v72M325 0v72M355 0v72"/>
  </g>

  <g class="worldlines" fill="none" stroke="url(#timeline)" stroke-linecap="round" filter="url(#line-glow)">
    <path d="M9 18c21 0 24 18 45 18s25-19 45-19 21 19 39 19" stroke-width="1.4" stroke-dasharray="8 7"/>
    <path d="M8 30c25 0 22 6 45 6s25-8 45-8 21 8 40 8" stroke-width="1.8" stroke-dasharray="12 6"/>
    <path d="M8 43c21 0 25-7 45-7s22 17 44 17 23-17 41-17" stroke-width="1.5" stroke-dasharray="9 8"/>
    <path d="M10 56c18 0 28-20 45-20s25 28 44 28 22-28 39-28" stroke-width="1.1" stroke-dasharray="5 7"/>
  </g>
  <g class="stability-core" transform="translate(139 36)" filter="url(#line-glow)">
    <circle r="24" fill="none" stroke="#8268F6" stroke-width="1" stroke-dasharray="3 5"/>
    <circle r="15" fill="none" stroke="#38EBFF" stroke-width="1.5" stroke-dasharray="11 5"/>
    <circle r="10" fill="url(#core)"/>
    <path d="M-7 0h14M0-7v14" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>

  <g font-family="'Arial Narrow', 'Source Han Sans SC', 'PingFang SC', sans-serif" font-weight="900" text-anchor="middle">
    <text x="277" y="50" fill="#040617" stroke="#040617" stroke-width="5" paint-order="stroke" font-size="27" letter-spacing="2.6">世界线维护者</text>
    <text class="wordmark shadow-cyan" x="275" y="48" fill="#30F3FF" opacity="0.7" font-size="27" letter-spacing="2.6">世界线维护者</text>
    <text class="wordmark shadow-pink" x="279" y="48" fill="#FF4FD8" opacity="0.65" font-size="27" letter-spacing="2.6">世界线维护者</text>
    <text class="wordmark main" x="277" y="48" fill="url(#word)" stroke="#211940" stroke-width="0.8" paint-order="stroke" font-size="27" letter-spacing="2.6" filter="url(#line-glow)">世界线维护者</text>
  </g>
  <g font-family="'IBM Plex Mono', monospace" font-weight="700" letter-spacing="1.7">
    <text x="174" y="14" fill="#62F3FF" font-size="6.2">TIMELINE // STABLE</text>
    <text x="381" y="63" fill="#F073DB" font-size="5.5" text-anchor="end">DIVERGENCE 0.000500</text>
  </g>

  <style>
    .worldlines path { animation: timeline-flow 2.2s linear infinite; }
    .worldlines path:nth-child(even) { animation-direction: reverse; animation-duration: 2.8s; }
    .stability-core { transform-origin: 139px 36px; animation: core-lock 3.6s linear infinite; }
    .main { animation: stabilize 2.9s ease-in-out infinite; }
    .shadow-cyan { animation: branch-cyan 3.4s steps(1, end) infinite; }
    .shadow-pink { animation: branch-pink 4.1s steps(1, end) infinite; }
    @keyframes timeline-flow { to { stroke-dashoffset: -45; } }
    @keyframes core-lock { to { transform: translate(139px,36px) rotate(360deg); } }
    @keyframes stabilize { 0%, 100% { opacity: .9; } 50% { opacity: 1; } }
    @keyframes branch-cyan { 0%, 76%, 81%, 100% { transform: translateX(0); opacity: .42; } 77% { transform: translateX(-4px); opacity: .9; } 79% { transform: translateX(2px); opacity: .6; } }
    @keyframes branch-pink { 0%, 41%, 46%, 100% { transform: translateX(0); opacity: .38; } 42% { transform: translateX(5px); opacity: .85; } 44% { transform: translateX(-2px); opacity: .58; } }
    @media (prefers-reduced-motion: reduce) {
      .worldlines path, .stability-core, .main, .shadow-cyan, .shadow-pink { animation: none; }
    }
  </style>
</svg>
