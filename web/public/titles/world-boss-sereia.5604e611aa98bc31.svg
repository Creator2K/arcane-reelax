<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-labelledby="title description">
  <title id="title">绯潮君临</title>
  <desc id="description">绯潮王冠与珍珠微光环绕的轻量动态典藏称号</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#210713"/>
      <stop offset=".52" stop-color="#4A0C2B"/>
      <stop offset="1" stop-color="#150711"/>
    </linearGradient>
    <linearGradient id="panel-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A52C59"/>
      <stop offset=".38" stop-color="#FFD58D"/>
      <stop offset=".72" stop-color="#FF779D"/>
      <stop offset="1" stop-color="#7E1B43"/>
    </linearGradient>
    <linearGradient id="rose-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4DA"/>
      <stop offset=".34" stop-color="#FFD18D"/>
      <stop offset=".68" stop-color="#FF7BA1"/>
      <stop offset="1" stop-color="#D93670"/>
    </linearGradient>
    <linearGradient id="tide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C164C" stop-opacity="0"/>
      <stop offset=".28" stop-color="#FF5D91"/>
      <stop offset=".7" stop-color="#FFD795"/>
      <stop offset="1" stop-color="#FF5D91" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pearl">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#FFE8F4"/>
      <stop offset="1" stop-color="#FF86AB"/>
    </radialGradient>
    <linearGradient id="crown-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7D6"/>
      <stop offset=".28" stop-color="#F8C66E"/>
      <stop offset=".58" stop-color="#E75482"/>
      <stop offset="1" stop-color="#8E164A"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7E123F"/>
      <stop offset=".55" stop-color="#E64678"/>
      <stop offset="1" stop-color="#FFB083"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-80%" width="150%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feOffset dy="1" result="offset"/>
      <feFlood flood-color="#3C0822" flood-opacity=".9"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .crown { animation: crown 3.6s ease-in-out infinite; transform-origin: 35px 31px; }
    .pearl { animation: pearl 2.8s ease-in-out infinite; transform-origin: 35px 31px; }
    .tide { animation: tide 5s linear infinite; }
    .spark { animation: spark 2.6s ease-in-out infinite; transform-origin: 279px 18px; }
    @keyframes crown { 50% { transform: translateY(-1px); } }
    @keyframes pearl { 50% { opacity: .68; transform: scale(.84); } }
    @keyframes tide { to { stroke-dashoffset: -56; } }
    @keyframes spark { 50% { opacity: .28; transform: scale(.65) rotate(45deg); } }
    @media (prefers-reduced-motion: reduce) { .crown, .pearl, .tide, .spark { animation: none; } }
  </style>
  <path d="M12 4h272l12 12v32l-12 12H12L4 50V14z" fill="url(#panel)" stroke="url(#panel-rim)" stroke-width="1.2"/>
  <path d="M14 7h268l10 10v29l-10 10H14L8 48V16z" fill="none" stroke="#FFF0C7" stroke-opacity=".14" stroke-width=".7"/>
  <path d="M66 50c34-10 48 7 80-1s50 5 81-1 43 4 63-1" fill="none" stroke="#FF6E98" stroke-opacity=".12" stroke-width="5"/>
  <g class="crown" stroke-linejoin="round" filter="url(#glow)">
    <path d="M11 43c2-10 0-17-4-24 8 3 13 7 17 13-1-9 1-18 6-26 4 7 6 15 5 24 4-9 10-16 18-20-2 8-1 16 3 23 4-6 9-10 16-12-4 7-6 14-5 22z" fill="url(#coral)" opacity=".42"/>
    <path d="M13 40l4-24 12 14 7-22 8 22 12-14 3 24z" fill="url(#crown-metal)" stroke="#FFE7A6" stroke-width="1.3"/>
    <path d="M16 39h40l-3 10c-10 4-24 4-34 0z" fill="#7C1745" stroke="#FFD995" stroke-width="1.2"/>
    <path d="M20 41h32l-2 4H22z" fill="#F6B869" opacity=".88"/>
    <path d="M19 20l9 14M54 20L45 34M36 11v21" fill="none" stroke="#FFF3C5" stroke-linecap="round" stroke-width="1" opacity=".8"/>
    <circle cx="18" cy="16" r="2" fill="#FFE19A"/><circle cx="36" cy="8" r="2.3" fill="#FFF6D7"/><circle cx="56" cy="16" r="2" fill="#FFE19A"/>
  </g>
  <circle class="pearl" cx="36" cy="38" r="5.2" fill="url(#pearl)" stroke="#FFF5E5" stroke-width=".8" filter="url(#glow)"/>
  <path class="tide" d="M64 51c30-10 47 7 77-1s52 6 81-1 45 4 68-2" fill="none" stroke="url(#tide)" stroke-width="1.7" stroke-dasharray="22 8"/>
  <path d="M69 15h27M254 15h18" stroke="url(#tide)" stroke-width="1" opacity=".7"/>
  <text x="178" y="43" fill="url(#rose-gold)" stroke="#4A0B2A" stroke-width="2.2" paint-order="stroke fill" text-anchor="middle" font-family="Songti SC, STSong, SimSun, serif" font-size="29" font-weight="900" letter-spacing="5" filter="url(#shadow)">绯潮君临</text>
  <path class="spark" d="M279 12l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#FFE5A7" filter="url(#glow)"/>
</svg>
