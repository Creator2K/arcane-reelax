<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-labelledby="title description">
  <title id="title">不灭航标</title>
  <desc id="description">穿透永夜的灯塔神光、星潮与永燃核心构成的高稀有动态称号</desc>
  <defs>
    <linearGradient id="beacon-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010711"/>
      <stop offset=".42" stop-color="#09223D"/>
      <stop offset=".7" stop-color="#120F31"/>
      <stop offset="1" stop-color="#020711"/>
    </linearGradient>
    <linearGradient id="beacon-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A7897"/>
      <stop offset=".25" stop-color="#73F1FF"/>
      <stop offset=".52" stop-color="#FFF2A6"/>
      <stop offset=".78" stop-color="#C88CFF"/>
      <stop offset="1" stop-color="#287EA0"/>
    </linearGradient>
    <linearGradient id="beacon-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".18" stop-color="#FFF7B9"/>
      <stop offset=".52" stop-color="#FFD25D"/>
      <stop offset=".82" stop-color="#F39A22"/>
      <stop offset="1" stop-color="#B95516"/>
    </linearGradient>
    <linearGradient id="beacon-letter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".2" stop-color="#FFF7BD"/>
      <stop offset=".5" stop-color="#FFD25C"/>
      <stop offset=".72" stop-color="#FFFBE0"/>
      <stop offset="1" stop-color="#E99B31"/>
    </linearGradient>
    <linearGradient id="beacon-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF8BB" stop-opacity=".94"/>
      <stop offset=".32" stop-color="#77ECFF" stop-opacity=".48"/>
      <stop offset="1" stop-color="#77ECFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beacon-flare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="beacon-core">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".18" stop-color="#FFF6A5"/>
      <stop offset=".5" stop-color="#FFD03F" stop-opacity=".84"/>
      <stop offset="1" stop-color="#62DFF1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="beacon-clip">
      <path d="M22 3h272l23 20v26l-23 20H22L3 50V22z"/>
    </clipPath>
    <mask id="beacon-word-mask">
      <rect width="320" height="72" fill="black"/>
      <text x="211" y="49" fill="white" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="29" font-weight="950" letter-spacing="3" text-anchor="middle">不灭航标</text>
    </mask>
    <filter id="beacon-glow" x="-70%" y="-100%" width="240%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feFlood flood-color="#FFF184" flood-opacity=".9" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="beacon-cyan-glow" x="-80%" y="-120%" width="260%" height="340%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feFlood flood-color="#66EFFF" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .beacon-beam-a { animation: beacon-sweep-a 4.8s ease-in-out infinite; transform-origin: 58px 25px; }
    .beacon-beam-b { animation: beacon-sweep-b 4.8s ease-in-out -2.4s infinite; transform-origin: 58px 25px; }
    .beacon-core { animation: beacon-core-pulse 2.1s ease-in-out infinite; transform-origin: 58px 25px; }
    .beacon-orbit { animation: beacon-orbit 9s linear infinite; transform-origin: 58px 25px; }
    .beacon-rail { animation: beacon-rail 2.8s linear infinite; }
    .beacon-flare { animation: beacon-flare 4.2s ease-in-out infinite; }
    .beacon-spark-a { animation: beacon-spark 2.4s ease-in-out infinite; }
    .beacon-spark-b { animation: beacon-spark 3.1s ease-in-out -1.4s infinite; }
    @keyframes beacon-sweep-a { 0%, 100% { opacity: .18; transform: rotate(-7deg); } 48% { opacity: .88; transform: rotate(7deg); } }
    @keyframes beacon-sweep-b { 0%, 100% { opacity: .12; transform: rotate(6deg); } 48% { opacity: .58; transform: rotate(-5deg); } }
    @keyframes beacon-core-pulse { 0%, 100% { opacity: .72; transform: scale(.86); } 50% { opacity: 1; transform: scale(1.18); } }
    @keyframes beacon-orbit { to { transform: rotate(360deg); } }
    @keyframes beacon-rail { to { stroke-dashoffset: -42; } }
    @keyframes beacon-flare { 0%, 18% { opacity: 0; transform: translateX(-45px) skewX(-18deg); } 30% { opacity: .95; } 58%, 100% { opacity: 0; transform: translateX(185px) skewX(-18deg); } }
    @keyframes beacon-spark { 0%, 100% { opacity: .25; transform: scale(.65) rotate(0); } 50% { opacity: 1; transform: scale(1.2) rotate(45deg); } }
    @media (prefers-reduced-motion: reduce) { .beacon-beam-a, .beacon-beam-b, .beacon-core, .beacon-orbit, .beacon-rail, .beacon-flare, .beacon-spark-a, .beacon-spark-b { animation: none; } }
  </style>

  <path d="M22 3h272l23 20v26l-23 20H22L3 50V22z" fill="url(#beacon-panel)" stroke="url(#beacon-rim)" stroke-width="2"/>
  <path d="M24 8h266l17 15M12 49l14 15h264l17-15" fill="none" stroke="url(#beacon-rim)" stroke-width=".9" opacity=".58"/>
  <g clip-path="url(#beacon-clip)">
    <path class="beacon-beam-a" d="M58 23 305 3v34z" fill="url(#beacon-beam)"/>
    <path class="beacon-beam-b" d="M58 23 286 31v28z" fill="url(#beacon-beam)" opacity=".55"/>
    <path d="M2 54c40-16 76 5 113-2s79-13 202-24v41H2z" fill="#143E68" opacity=".36"/>
    <path d="M2 59c44-11 76 7 116-1s86-13 199-24" fill="none" stroke="#62DFF2" stroke-width="1.6" opacity=".58"/>
    <path d="M89 16h210M100 55h193" fill="none" stroke="#866BC5" stroke-width=".7" stroke-dasharray="2 7" opacity=".55"/>
  </g>
  <path class="beacon-rail" d="M5 22h30l8-8h52M226 60h56l8-8h25" fill="none" stroke="url(#beacon-rim)" stroke-width="2" stroke-dasharray="18 6"/>

  <circle class="beacon-core" cx="58" cy="25" r="28" fill="url(#beacon-core)"/>
  <circle class="beacon-orbit" cx="58" cy="25" r="22" fill="none" stroke="url(#beacon-rim)" stroke-width="1.4" stroke-dasharray="3 5" opacity=".9"/>
  <g transform="translate(58 40)">
    <path d="M-15 24h30L10-9H-10z" fill="#081425" stroke="#F5C44E" stroke-width="1.8"/>
    <path d="M-11-11h22l5 5h-32zM-15 21h30v4h-30z" fill="url(#beacon-gold)"/>
    <path d="M-9-21H9v10H-9z" fill="#061423" stroke="#FFD969" stroke-width="1.6"/>
    <rect x="-6" y="-18" width="12" height="5" fill="#FFF7B0" filter="url(#beacon-glow)"/>
    <path d="M0-29v8M-7-26H7M-6-2H6M-5 7H5M-4 15H4" fill="none" stroke="#EFB844" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <text x="211" y="49" fill="#020610" stroke="#020610" stroke-width="5" paint-order="stroke" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="29" font-weight="950" letter-spacing="3" text-anchor="middle">不灭航标</text>
  <text x="211" y="49" fill="url(#beacon-letter)" stroke="#8B5413" stroke-width=".8" paint-order="stroke" filter="url(#beacon-glow)" font-family="'Noto Sans SC','PingFang SC',sans-serif" font-size="29" font-weight="950" letter-spacing="3" text-anchor="middle">不灭航标</text>
  <rect class="beacon-flare" x="109" y="16" width="28" height="42" fill="url(#beacon-flare)" mask="url(#beacon-word-mask)"/>
  <g fill="#EAFDFF" filter="url(#beacon-cyan-glow)">
    <path class="beacon-spark-a" d="m134 14 2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
    <path class="beacon-spark-b" d="m279 19 1.5 3.5L284 24l-3.5 1.5-1.5 3.5-1.5-3.5L274 24l3.5-1.5z"/>
    <circle class="beacon-spark-a" cx="296" cy="42" r="1.7"/>
  </g>
  <text x="295" y="62" fill="#79EAF6" font-family="monospace" font-size="5.5" font-weight="700" letter-spacing="1.2" text-anchor="end">ETERNAL // BEACON</text>
</svg>
